server.port=8080

# --- CSRF protection toggle -------------------------------------------------
# false = VULNERABLE (no anti-CSRF token required on state-changing POSTs)
# true  = MITIGATED  (Spring Security synchronizer-token/double-submit enforced)
app.csrf.protection=false

# --- Postgres ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/devforge
spring.datasource.username=devforge
spring.datasource.password=devforge
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Session cookie: Lax is the browser default and is enough for this same-site
# (localhost) lab. See README for why SameSite is itself a CSRF defence.
server.servlet.session.cookie.same-site=lax
